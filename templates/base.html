<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}معرض الأثاث{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <!-- الهيدر العلوي للموبايل والدسكتب -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'product_list' %}" class="text-xl md:text-2xl font-extrabold text-amber-900 tracking-tight flex items-center gap-2">
                🛋️ <span>معرض الأثاث</span>
            </a>
            
            <div class="flex items-center gap-3">
                <a href="{% url 'about_us' %}" class="text-xs md:text-sm font-semibold text-gray-700 hover:text-amber-800">من نحن</a>
                <a href="https://wa.me/201003978938" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold transition flex items-center gap-1 shadow-sm">
                    💬 <span class="hidden sm:inline">تواصل مباشر</span>
                </a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي يتمدد ليدفع الفوتر للأسفل -->
    <main class="flex-grow max-w-7xl mx-auto px-3 sm:px-4 py-4 md:py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- الفوتر مثبت دائماً في أسفل الشاشة -->
    <footer class="bg-gray-900 text-gray-400 py-6 border-t border-gray-800 text-center text-xs md:text-sm mt-auto w-full">
        <div class="max-w-7xl mx-auto px-4 space-y-2">
            <p>جميع الحقوق محفوظة  ©  مهندس / صالح محمد صالح</p>
        </div>
    </footer>

</body>
</html>
